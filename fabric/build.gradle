plugins {
    id 'java-library'
    // Minecraft 1.21.11 and older ship obfuscated, so this build remaps (26.x does not).
    id 'net.fabricmc.fabric-loom-remap' version '1.18.3'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

// The shared code and assets compile into this jar; common/ has no build of its own.
sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    resources.srcDir rootProject.file('common/src/main/resources')
}
sourceSets.test {
    java.srcDir rootProject.file('common/src/test/java')
    resources.srcDir rootProject.file('common/src/test/resources')
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

loom {
    accessWidenerPath = file('src/main/resources/moblevel.classtweaker')
    runs {
        configureEach {
            runDir 'run'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testImplementation 'ch.qos.logback:logback-classic:1.5.18'
    testImplementation 'org.slf4j:slf4j-api:2.0.17'
}

processResources {
    var replaceProperties = [
            mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_authors: mod_authors,
            mod_description: mod_description, fabric_loader_version: fabric_loader_version,
            fabric_minecraft_version_range: fabric_minecraft_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
